          description: ''
  /api/activity-types/:
    get:
      operationId: api_activity_types_list
      description: |-
        Activity Type API (Read-Only)

        Provides read-only access to activity type definitions used to categorize
        activities (tasks, calls, meetings, etc.). These types are agency-specific
        and are typically managed through the admin interface.

        **Authentication**: Requires API token or valid session

        **Permissions**:
        - Requires `activity` scope (read/write/delete)
        - Uses the same permission class as Activity endpoints

        **Activity Type Data**:
        - `id`: Unique identifier for the activity type
        - `name`: Display name (e.g., "Call", "Meeting", "Email")
        - `description`: Optional description of the activity type

        **Use Cases**:
        - Populating activity type dropdowns when creating/editing activities
        - Filtering activities by type
        - Understanding available activity categories
        - Building custom activity management UIs

        **Note**: This is a read-only endpoint. Activity types are managed through
        the agency administration interface at `/administration/activities/types/`.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Activities
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityTypeList'
          description: ''
