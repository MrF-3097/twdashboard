  /api/activities/{id}/mark_done/:
    post:
      operationId: api_activities_mark_done_create
      description: |-
        Mark an activity as completed.

        Sets the activity status to done and records the completion timestamp.
        Only users with appropriate permissions can mark activities as done.

        **Permissions**: User must be assigned to the activity or have edit permissions.
        **Response**: Updated activity object with done=true and date_done set.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activity.
        required: true
      tags:
      - Activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/activities/{id}/mark_undone/:
    post:
      operationId: api_activities_mark_undone_create
      description: |-
        Mark an activity as not completed.

        Reverts a completed activity back to pending status by setting done=false
        and clearing the completion timestamp.

        **Permissions**: User must have edit permissions for this activity.
        **Response**: Updated activity object with done=false and date_done=null.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activity.
        required: true
      tags:
      - Activities
      requestBody:
        content:
