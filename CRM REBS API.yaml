      description: |-
        * `5` - Incompletă
        * `1` - Activă
        * `7` - Antecontract / Rezervat
        * `4` - Tranzacționată de noi
        * `2` - Tranzacționată de alții
        * `3` - Retrasă
    PropertyLeadSource:
      type: object
      description: |-
        Serializer for PropertyLeadSource objects.

        Property lead sources are agency-configurable sources that track where
        a property listing originated from (e.g., 'Anunțuri particulari REBS', 'Recomandare').
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nume sursă lead
          maxLength: 80
      required:
      - name
