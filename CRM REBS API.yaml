  /api/properties/create_from_market_snapshot/:
    post:
      operationId: property_create_from_market_snapshot
      description: "\n        Create a new property by fetching data from a Market\
        \ Snapshot property ad.\n\n        **User Assignment Logic:**\n        - If\
        \ `agent_id` is provided: Property is assigned to that agent (must exist in\
        \ agency)\n        - If using user authentication without `agent_id`: Property\
        \ is assigned to authenticated user\n        - If using agency token without\
        \ `agent_id`: Property is left unassigned (agent=None)\n\n        **Contact\
        \ Creation:**\n        - Automatically creates/finds contact from PropertyAd\
        \ phone and name data\n        - Associates contact with the property and\
        \ assigned agent\n\n        **No Duplicate Checking:**\n        - Always creates\
        \ a new property regardless of existing similar properties\n        "
      summary: Create Property from Market Snapshot
      tags:
      - Properties
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                market_snapshot_id:
                  type: integer
                  description: The PropertyAd ID from market snapshot
                property_type:
                  type: integer
                  description: Override property type (optional)
                agent_id:
                  type: integer
                  description: Agent ID to assign property to (optional - if not provided,
                    property may be unassigned)
              required:
              - market_snapshot_id
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
          description: ''
  /api/property-lead-sources/:
    get:
      operationId: api_property_lead_sources_list
      description: |-
        Property Lead Source API

        Manage agency-configurable lead sources for tracking where property listings
        originated (e.g., 'Anunțuri particulari REBS', 'Recomandare', 'Referral').

        **Authentication**: Requires API token or valid session

        **Permissions**:
        - API tokens: Require `property` scope with appropriate permissions (read/write)
        - Session authentication: Read access for all authenticated users, write access for admin users only

        **CRUD Operations**:
        - `GET /api/property-lead-sources/`: List all property lead sources
        - `POST /api/property-lead-sources/`: Create a new lead source
        - `GET /api/property-lead-sources/{id}/`: Get a specific lead source
        - `PUT/PATCH /api/property-lead-sources/{id}/`: Update a lead source

        **Note**: Deletion is not supported via API. Lead sources must be deleted
        through the web administration interface to prevent accidental data loss.

        **Data Fields**:
        - `id`: Unique identifier (read-only)
        - `name`: Lead source name (required, unique per agency)

        **Validation**:
        - Names must be unique within the agency
        - Lead sources are automatically associated with the current agency

        **Use Cases**:
        - Create custom lead sources specific to your agency's marketing channels
        - Track property acquisition sources for analytics
        - Populate lead source dropdowns in property forms
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
