  /api/contacts/:
    get:
      operationId: api_contacts_list
      description: |-
        Contact Management API

        Complete contact management system for leads, clients, and business contacts.
        Handles contact details, phone numbers, emails, and company associations.

        **Authentication**: Requires API token or valid session

        **Permissions**: Based on agency permissions (view_all_contacts, edit_all_contacts)

        **Filtering**: Supports filtering via query parameters:
        - `first_name`, `last_name`: name-based searches
        - `agents`: filter by assigned agent IDs
        - `tags`: filter by contact tags
        - `companies`: filter by associated companies
        - `ordering`: sort by date_added, first_name, last_name

        **Custom Actions**:
        - `GET /{id}/properties/`: Get associated properties
        - `GET /{id}/requests/`: Get buyer requests for this contact

        **Contact Data**: Each contact includes:
        - Personal information (name, CNP, ID number, birthdate)
        - Contact methods (phones, emails with types)
        - Company associations with positions
        - Assigned agents and permissions

        **Contact Creation with Phone/Email**:
        When creating contacts, you can include single `phone` and `email` fields:
        ```json
        {
            "first_name": "John",
            "last_name": "Doe",
            "phone": "0745123456",
            "email": "john@example.com"
        }
        ```

        **Duplicate Detection**:
        The API automatically checks for existing contacts with the same phone number.
        If found, returns the existing contact (HTTP 200) instead of creating a duplicate.
        This mirrors the web interface behavior and prevents contact duplication.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Contacts
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
      operationId: api_contacts_create
      description: |-
        Create a new contact, but first check if a contact with the same phone number already exists.
        If it does, return the existing contact ID instead of creating a duplicate.

        When authenticated as a user (not agency token), automatically adds the user to contact's agents.
        For deduplication, allows access to existing contacts even without permission and adds current user as agent.

        This mirrors the behavior of the web interface contact creation.
      tags:
      - Contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
