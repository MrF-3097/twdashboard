  /api/requests/:
    get:
      operationId: api_requests_list
      description: |-
        Buyer Request Management API

        Manages buyer requirements and property matching requests. Handles client
        preferences, search criteria, and automated property matching.

        **Authentication**: Requires API token or valid session

        **Permissions**: Based on agency permissions (view_all_requests, edit_all_requests)

        **Filtering**: Supports filtering via query parameters:
        - `property_type`: apartment, house, commercial, etc.
        - `transaction_type`: rent, sale
        - `agent`: filter by assigned agent
        - `region_id`, `cities`: location preferences
        - `price_filter_gte`, `price_filter_lte`: price range
        - `surface_useable_filter_gte`, `surface_useable_filter_lte`: surface filters
        - `rooms_filter_gte`, `rooms_filter_lte`: room count filters
        - `ordering`: sort by date_added, title

        **Custom Actions**:
        - `GET /{id}/matching_properties/`: Get property IDs matching this request
        - `GET /{id}/activities/`: Get activities for this request

        **Request Features**:
        - Advanced filtering criteria (price, surface, rooms, location)
        - Property feature preferences (basement, parking, etc.)
        - Automated matching with existing properties
        - Activity tracking and follow-ups
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Requests
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
