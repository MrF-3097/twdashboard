        **Filtering**: Supports filtering via query parameters:
        - `type`: activity type (call, meeting, email, etc.)
        - `status`: activity status
        - `done`: boolean filter for completed activities
        - `added_by`: filter by creator
        - `users`: filter by assigned users
        - `all_day`: boolean filter for all-day activities
        - `date_from_gte`, `date_from_lte`: date range filters
        - `ordering`: sort by date_added, date_from, title

        **Custom Actions**:
        - `POST /{id}/mark_done/`: Mark activity as completed
        - `POST /{id}/mark_undone/`: Mark activity as not done

        **Activity Features**:
        - Date/time scheduling with all-day options
        - Multi-user assignment capabilities
        - Reminder settings (count, type, email, calendar)
        - Association with properties, contacts, and requests
        - Result tracking and notes
        - Automatic user assignment based on permissions
      tags:
      - Activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
