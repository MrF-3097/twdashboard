openapi: 3.0.3
info:
  title: CRM REBS API
  version: 1.0.0
  description: |
    Comprehensive REST API for CRM REBS

    This API provides access to properties, contacts, buyer requests, activities, and user management.
    Perfect for mobile app development, third-party integrations, and automated workflows.

    ## Authentication

    All API endpoints require authentication using API tokens.

    ### How to Pass API Tokens

    API tokens can be passed in **two ways**:

    #### 1. Authorization Header (Recommended)
    ```
    Authorization: Token <your_token_here>
    ```

    Example:
    ```bash
    curl -H "Authorization: Token a1b2c3d4e5f6..." https://youragency.crmrebs.com/api/properties/
    ```

    #### 2. Query Parameter
    ```
    ?token=<your_token_here>
    ```

    Example:
    ```bash
    curl https://youragency.crmrebs.com/api/properties/?token=a1b2c3d4e5f6...
    ```

    > **Note:** The Authorization header method is recommended for security reasons.

    ### Token Types

    **Agency Tokens:**
    - Full access to all agency data (subject to scopes)
    - Used for system integrations and external applications

    **User Tokens:**
    - Limited to user's own data and permissions (subject to scopes)
    - Used for personal automation and user-specific integrations
    - Operates with specific user's permissions

    ### Token Scopes

    Tokens have fine-grained permissions called **scopes** that control access to specific object types:

    - `property` - Property listings (read/write/delete)
    - `contact` - Contacts and leads (read/write/delete)
    - `request` - Buyer requests (read/write/delete)
    - `activity` - Activities and tasks (read/write/delete)
    - `user` - User information (read-only)

    **Important:** Permission levels are independent - there is no hierarchy. To get full access, assign all three permission levels (read, write, delete).

    ### Getting API Tokens

    Contact your agency administrator to create API tokens with appropriate scopes for your use case.
  contact:
    name: CRM REBS Support
    email: suport@crmrebs.com
  license:
    name: Proprietary
paths:
  /api/activities/:
    get:
      operationId: api_activities_list
      description: |-
        Activity & Task Management API

        Complete task and activity management system for scheduling, reminders,
        and follow-ups. Handles appointments, calls, meetings, and custom activities.

        **Authentication**: Requires API token or valid session

        **Permissions**: Users can only see activities they're assigned to

        **Filtering**: Supports filtering via query parameters:
        - `type`: activity type (call, meeting, email, etc.)
        - `status`: activity status
        - `done`: boolean filter for completed activities
        - `added_by`: filter by creator
        - `users`: filter by assigned users
        - `all_day`: boolean filter for all-day activities
        - `date_from_gte`, `date_from_lte`: date range filters
        - `ordering`: sort by date_added, date_from, title

        **Custom Actions**:
        - `POST /{id}/mark_done/`: Mark activity as completed
        - `POST /{id}/mark_undone/`: Mark activity as not done

        **Activity Features**:
        - Date/time scheduling with all-day options
        - Multi-user assignment capabilities
        - Reminder settings (count, type, email, calendar)
        - Association with properties, contacts, and requests
        - Result tracking and notes
        - Automatic user assignment based on permissions
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Activities
      security:
      - ApiTokenAuth: []
      - ApiTokenQuery: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: api_activities_create
      description: |-
        Activity & Task Management API

        Complete task and activity management system for scheduling, reminders,
        and follow-ups. Handles appointments, calls, meetings, and custom activities.

        **Authentication**: Requires API token or valid session

