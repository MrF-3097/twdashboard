version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REBS_API_TOKEN=${REBS_API_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:///./data/database.sqlite
      - DEBUG=true
    volumes:
      - ./data:/app/data
      - ./app:/app/app  # Mount app pentru hot reload (development)
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:



















